name: temporary-help-modal-fix
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: write
jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Center help popup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/app/view.go')
          s = p.read_text()
          old = 'return lipgloss.JoinVertical(lipgloss.Center, box, "", background)'
          new = '''w, h := m.width, m.height
	if w <= 0 { w = 80 }
	if h <= 0 { h = 24 }
	_ = background
	return lipgloss.Place(w, h, lipgloss.Center, lipgloss.Center, box)'''
          if old not in s:
              raise SystemExit('help view replacement target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          gofmt -w internal/app/view.go
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          make build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/view.go
          git commit -m "Render shortcuts as centered modal" || exit 0
          git push
