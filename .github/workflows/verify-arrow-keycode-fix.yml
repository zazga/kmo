name: temporary-arrow-keycode-verify
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch navigation to physical keycodes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/app/update.go')
          s = p.read_text()
          s = s.replace('keyMatches(msg, m.keys.Up) || msg.String() == "ctrl+p"', 'isUpKey(msg, m.keys.Up) || msg.String() == "ctrl+p"')
          s = s.replace('keyMatches(msg, m.keys.Down) || msg.String() == "ctrl+n"', 'isDownKey(msg, m.keys.Down) || msg.String() == "ctrl+n"')
          s = s.replace('keyMatches(msg, m.keys.Up) || msg.String() == "k"', 'isUpKey(msg, m.keys.Up) || msg.String() == "k"')
          s = s.replace('keyMatches(msg, m.keys.Down) || msg.String() == "j"', 'isDownKey(msg, m.keys.Down) || msg.String() == "j"')
          p.write_text(s)
          PY
          gofmt -w internal/app/update.go
      - name: Add navigation regression tests
        run: |
          cat >> internal/app/state_test.go <<'EOF'

          func TestSidebarPhysicalArrowNavigation(t *testing.T) {
              m := Model{mode: modeMain, focus: ui.FocusSidebar, sidebar: ui.NewSidebar()}
              m.keys = newKeymap(config.Defaults().Keybindings)
              m.sidebar.Filtered = []*mm.Conversation{
                  {Channel: &model.Channel{Id: "a"}, Display: "A"},
                  {Channel: &model.Channel{Id: "b"}, Display: "B"},
              }
              next, _ := m.updateMainKey(tea.KeyPressMsg(tea.Key{Code: tea.KeyDown}))
              got := next.(Model)
              if got.sidebar.Cursor != 1 {
                  t.Fatalf("down arrow cursor=%d, want 1", got.sidebar.Cursor)
              }
              next, _ = got.updateMainKey(tea.KeyPressMsg(tea.Key{Code: tea.KeyUp}))
              got = next.(Model)
              if got.sidebar.Cursor != 0 {
                  t.Fatalf("up arrow cursor=%d, want 0", got.sidebar.Cursor)
              }
          }

          func TestSearchPhysicalArrowNavigation(t *testing.T) {
              m := Model{mode: modeMain, focus: ui.FocusSidebar, sidebar: ui.NewSidebar()}
              m.keys = newKeymap(config.Defaults().Keybindings)
              m.sidebar.Finding = true
              m.sidebar.Filtered = []*mm.Conversation{
                  {Channel: &model.Channel{Id: "a"}, Display: "A"},
                  {Channel: &model.Channel{Id: "b"}, Display: "B"},
              }
              next, _ := m.updateMainKey(tea.KeyPressMsg(tea.Key{Code: tea.KeyDown}))
              got := next.(Model)
              if got.sidebar.Cursor != 1 {
                  t.Fatalf("search down arrow cursor=%d, want 1", got.sidebar.Cursor)
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/app/state_test.go')
          s=p.read_text()
          # Extend imports only if needed.
          s=s.replace('"testing"\n\n\t"github.com/mattermost', '"testing"\n\n\ttea "charm.land/bubbletea/v2"\n\t"github.com/mattermost')
          s=s.replace('"github.com/zazga/kmo/internal/ui"', '"github.com/zazga/kmo/internal/config"\n\tmm "github.com/zazga/kmo/internal/mattermost"\n\t"github.com/zazga/kmo/internal/ui"')
          p.write_text(s)
          PY
          gofmt -w internal/app/state_test.go
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          make build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/update.go internal/app/state_test.go
          git commit -m "Handle physical arrow keys by keycode" || exit 0
          git push
