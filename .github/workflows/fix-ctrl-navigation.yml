name: temporary-ctrl-navigation-fix
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: write
concurrency:
  group: kmo-ctrl-navigation-fix
  cancel-in-progress: true
jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch defaults and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/config/config.go')
          s = p.read_text()
          s = s.replace('FocusNext: "tab", FocusPrevious: "cmd+tab", Find: "cmd+f",\n\t\tReply: "cmd+r", Send: "cmd+enter", Shortcuts: "cmd+?",',
                        'FocusNext: "tab", FocusPrevious: "ctrl+tab", Find: "ctrl+f",\n\t\tReply: "ctrl+r", Send: "ctrl+enter", Shortcuts: "ctrl+h",')
          p.write_text(s)

          p = Path('internal/config/config_test.go')
          s = p.read_text()
          s = s.replace('"cmd+enter"', '"ctrl+enter"')
          s = s.replace("find = 'cmd+f'\\nsend = 'cmd+f'", "find = 'ctrl+f'\\nsend = 'ctrl+f'")
          s = s.replace('cfg.Keybindings.Find != "cmd+f"', 'cfg.Keybindings.Find != "ctrl+f"')
          p.write_text(s)

          p = Path('internal/app/update.go')
          s = p.read_text()
          old = '''\tif m.sidebar.Finding {\n\t\tswitch msg.Keystroke() {\n\t\tcase "escape":\n'''
          new = '''\tif m.sidebar.Finding {\n\t\tif keyMatches(msg, m.keys.Cancel) {\n\t\t\tm.sidebar.Finding = false\n\t\t\tm.sidebar.Query.Blur()\n\t\t\tm.sidebar.Query.SetValue("")\n\t\t\tm.sidebar.ApplyFilter(m.conversations)\n\t\t\tm.alignSidebarCursor()\n\t\t\treturn m, nil\n\t\t}\n\t\tif keyMatches(msg, m.keys.Up) || msg.Keystroke() == "ctrl+p" {\n\t\t\tm.moveSidebar(-1)\n\t\t\treturn m, nil\n\t\t}\n\t\tif keyMatches(msg, m.keys.Down) || msg.Keystroke() == "ctrl+n" {\n\t\t\tm.moveSidebar(1)\n\t\t\treturn m, nil\n\t\t}\n\t\tswitch msg.Keystroke() {\n\t\tcase "escape":\n'''
          if old not in s:
              raise SystemExit('search block target not found')
          s = s.replace(old, new, 1)
          s = s.replace('''\t\tcase "up", "ctrl+p":\n\t\t\tm.moveSidebar(-1)\n\t\t\treturn m, nil\n\t\tcase "down", "ctrl+n":\n\t\t\tm.moveSidebar(1)\n\t\t\treturn m, nil\n''', '', 1)

          old = '''\tcase ui.FocusSidebar:\n\t\tswitch msg.Keystroke() {\n\t\tcase "up", "k":\n\t\t\tm.moveSidebar(-1)\n\t\tcase "down", "j":\n\t\t\tm.moveSidebar(1)\n\t\tcase "enter", "return":\n'''
          new = '''\tcase ui.FocusSidebar:\n\t\tif keyMatches(msg, m.keys.Up) || msg.Keystroke() == "k" {\n\t\t\tm.moveSidebar(-1)\n\t\t\treturn m, nil\n\t\t}\n\t\tif keyMatches(msg, m.keys.Down) || msg.Keystroke() == "j" {\n\t\t\tm.moveSidebar(1)\n\t\t\treturn m, nil\n\t\t}\n\t\tswitch msg.Keystroke() {\n\t\tcase "enter", "return":\n'''
          if old not in s:
              raise SystemExit('sidebar navigation target not found')
          s = s.replace(old, new, 1)

          old = '''\tcase ui.FocusChat:\n\t\tswitch msg.Keystroke() {\n\t\tcase "up", "k":\n\t\t\tm.moveMessageSelection(-1)\n\t\t\tm.chat.Viewport.ScrollUp(2)\n\t\t\tif m.chat.Viewport.AtTop() && m.chat.HasOlder && !m.chat.LoadingOlder {\n\t\t\t\treturn m, m.loadOlder()\n\t\t\t}\n\t\tcase "down", "j":\n\t\t\tm.moveMessageSelection(1)\n\t\t\tm.chat.Viewport.ScrollDown(2)\n\t\t\tif m.chat.Viewport.AtBottom() {\n\t\t\t\tm.chat.NewMessages = false\n\t\t\t}\n\t\tcase "pageup":\n'''
          new = '''\tcase ui.FocusChat:\n\t\tif keyMatches(msg, m.keys.Up) || msg.Keystroke() == "k" {\n\t\t\tm.moveMessageSelection(-1)\n\t\t\tm.chat.Viewport.ScrollUp(2)\n\t\t\tif m.chat.Viewport.AtTop() && m.chat.HasOlder && !m.chat.LoadingOlder {\n\t\t\t\treturn m, m.loadOlder()\n\t\t\t}\n\t\t\treturn m, nil\n\t\t}\n\t\tif keyMatches(msg, m.keys.Down) || msg.Keystroke() == "j" {\n\t\t\tm.moveMessageSelection(1)\n\t\t\tm.chat.Viewport.ScrollDown(2)\n\t\t\tif m.chat.Viewport.AtBottom() {\n\t\t\t\tm.chat.NewMessages = false\n\t\t\t}\n\t\t\treturn m, nil\n\t\t}\n\t\tswitch msg.Keystroke() {\n\t\tcase "pageup":\n'''
          if old not in s:
              raise SystemExit('chat navigation target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w internal/config/config.go internal/config/config_test.go internal/app/update.go
      - name: Add regression tests
        run: |
          cat >> internal/app/keymap_test.go <<'EOF'

          func TestArrowBindingsMatchDefaults(t *testing.T) {
              if !keyMatches(tea.KeyPressMsg(tea.Key{Code: tea.KeyUp}), "up") {
                  t.Fatal("expected up arrow to match up binding")
              }
              if !keyMatches(tea.KeyPressMsg(tea.Key{Code: tea.KeyDown}), "down") {
                  t.Fatal("expected down arrow to match down binding")
              }
          }
          EOF
          gofmt -w internal/app/keymap_test.go
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          make build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/config.go internal/config/config_test.go internal/app/update.go internal/app/keymap_test.go
          git commit -m "Use Ctrl defaults and fix navigation" || exit 0
          git push
