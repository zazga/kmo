name: temporary-key-interaction-fix
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: write
concurrency:
  group: kmo-key-interaction-fix
  cancel-in-progress: true
jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch key handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('internal/app/keymap.go')
          s = p.read_text()
          old = '''\tif base == "/" && containsString(mods, "shift") {\n\t\tbase = "?"\n\t\tmods = removeString(mods, "shift")\n\t}\n'''
          new = '''\tif (base == "/" || base == "?") && containsString(mods, "shift") {\n\t\tbase = "?"\n\t\tmods = removeString(mods, "shift")\n\t}\n'''
          if old not in s:
              raise SystemExit('keymap replacement target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/app/update.go')
          s = p.read_text()
          old = '''\t\tcase "enter":\n\t\t\tif selected := m.selectedConversation(); selected != nil {\n\t\t\t\tm.sidebar.Finding = false\n\t\t\t\tm.sidebar.Query.Blur()\n\t\t\t\treturn m.openConversation(selected)\n\t\t\t}\n\t\t\treturn m, nil\n'''
          new = '''\t\tcase "enter", "return":\n\t\t\tif selected := m.selectedConversation(); selected != nil {\n\t\t\t\tm.sidebar.Finding = false\n\t\t\t\tm.sidebar.Query.Blur()\n\t\t\t\tm.sidebar.Query.SetValue("")\n\t\t\t\tm.sidebar.ApplyFilter(m.conversations)\n\t\t\t\tm.focus = ui.FocusChat\n\t\t\t\tm.applyFocus()\n\t\t\t\treturn m.openConversation(selected)\n\t\t\t}\n\t\t\treturn m, nil\n'''
          if old not in s:
              raise SystemExit('fuzzy enter replacement target not found')
          s = s.replace(old, new, 1)
          old2 = '''\t\tcase "enter":\n\t\t\tif selected := m.selectedConversation(); selected != nil {\n\t\t\t\treturn m.openConversation(selected)\n\t\t\t}\n'''
          new2 = '''\t\tcase "enter", "return":\n\t\t\tif selected := m.selectedConversation(); selected != nil {\n\t\t\t\tm.focus = ui.FocusChat\n\t\t\t\tm.applyFocus()\n\t\t\t\treturn m.openConversation(selected)\n\t\t\t}\n'''
          if old2 not in s:
              raise SystemExit('sidebar enter replacement target not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
          gofmt -w internal/app/keymap.go internal/app/update.go
      - name: Add regression tests
        run: |
          cat >> internal/app/keymap_test.go <<'EOF'

          func TestCommandQuestionMarkWithShiftedQuestionMark(t *testing.T) {
              msg := tea.KeyPressMsg(tea.Key{Code: '?', Mod: tea.ModSuper | tea.ModShift})
              if !keyMatches(msg, "cmd+?") {
                  t.Fatal("expected cmd+shift+? terminal form to match cmd+?")
              }
          }
          EOF
          gofmt -w internal/app/keymap_test.go
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build macOS arm64
        run: make build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/keymap.go internal/app/keymap_test.go internal/app/update.go
          if ! git diff --cached --quiet; then
            git commit -m "Fix help shortcut and fuzzy activation"
            git push
          fi
