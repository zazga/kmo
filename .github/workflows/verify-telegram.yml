name: verify telegram feature
on:
  push:
    branches: [feature/telegram-forwarder]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: make build
