name: temporary-v1-verify
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build macOS arm64
        run: make build
      - name: Archive dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: go.sum
