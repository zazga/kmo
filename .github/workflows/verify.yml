name: temporary-v1-verify
on:
  push:
    branches: [feature/mattermost-tui-v1]
concurrency:
  group: kmo-v1-verify
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Commit dependency lockfile when needed
        run: |
          if ! git diff --quiet -- go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.sum
            git commit -m "Add Go dependency lockfile"
            git push
            exit 0
          fi
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build macOS arm64
        run: make build
