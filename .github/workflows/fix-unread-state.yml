name: temporary-unread-state-fix
on:
  push:
    branches: [feature/mattermost-tui-v1]
permissions:
  contents: write
jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch unread detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/mattermost/service.go')
          s = p.read_text()
          old = '''\t\tif member != nil {\n\t\t\tconv.Unread = member.LastViewedAt < ch.LastPostAt\n\t\t\tconv.Mention = member.MentionCount > 0\n\t\t}\n'''
          new = '''\t\tif member != nil {\n\t\t\tconv.Unread = channelHasUnread(ch, member)\n\t\t\tconv.Mention = member.MentionCount > 0\n\t\t}\n'''
          if old not in s:
              raise SystemExit('unread target not found')
          s = s.replace(old, new, 1)
          insert = '''\nfunc channelHasUnread(ch *model.Channel, member *model.ChannelMember) bool {\n\tif ch == nil || member == nil {\n\t\treturn false\n\t}\n\t// Mattermost tracks the member's read position using message counts.\n\t// LastViewedAt can remain stale for old/migrated channels, which causes\n\t// false unread indicators when compared directly with LastPostAt.\n\treturn ch.TotalMsgCount > member.MsgCount\n}\n\n'''
          marker = 'func SortConversations(items []*Conversation) {'
          if marker not in s:
              raise SystemExit('sort marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          gofmt -w internal/mattermost/service.go
      - name: Add regression tests
        run: |
          cat >> internal/mattermost/service_test.go <<'EOF'

          func TestChannelHasUnreadUsesMessageCountsNotStaleTimestamp(t *testing.T) {
              ch := &model.Channel{LastPostAt: 1_700_000_000_000, TotalMsgCount: 42}
              member := &model.ChannelMember{LastViewedAt: 1, MsgCount: 42}
              if channelHasUnread(ch, member) {
                  t.Fatal("expected no unread when message counts match despite stale LastViewedAt")
              }
          }

          func TestChannelHasUnreadWhenChannelCountAdvanced(t *testing.T) {
              ch := &model.Channel{TotalMsgCount: 43}
              member := &model.ChannelMember{MsgCount: 42}
              if !channelHasUnread(ch, member) {
                  t.Fatal("expected unread when channel has more messages than member has read")
              }
          }
          EOF
          gofmt -w internal/mattermost/service_test.go
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          make build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/mattermost/service.go internal/mattermost/service_test.go
          git commit -m "Fix stale unread indicators"
          git pull --rebase origin feature/mattermost-tui-v1
          git push
